[package]
name = "wargame"
version = "0.1.0"
description = "Procedural RTS map generator"
edition = "2021"

[lib]
name = "wargame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
